name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spawner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Service containers can't take a command, and NATS needs -js for
      # JetStream, so it runs as a plain container.
      - name: Start NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js
          for i in $(seq 1 30); do nc -z localhost 4222 && exit 0; sleep 1; done
          echo "NATS did not start" && exit 1

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (unit + integration, race detector)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/spawner?sslmode=disable
          TEST_NATS_URL: nats://localhost:4222
        run: go test -race -count=1 ./...

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Console JavaScript parses
        run: |
          node --check internal/ui/static/app.js
          node --check internal/ui/static/markdown.js
          node --test internal/ui/markdown.test.js

      - name: Kustomize overlays render
        run: |
          for k in deploy/kustomize/base deploy/kustomize/keda deploy/kustomize/overlays/andor; do
            echo "== $k"; kubectl kustomize "$k" > /dev/null
          done

      - name: Python harnesses compile
        run: python3 -m py_compile experiments/chunking/*.py experiments/stress/*.py

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build container image (no push)
        run: docker build -t agent-spawner:ci .
      - name: Smoke-test the binary
        run: |
          docker run --rm agent-spawner:ci 2>&1 | grep -q "usage: spawner"
