# Cluster overlay for andor.empire.byrd.guru (3-node homelab, no ingress
# controller). The console is exposed on NodePort 30880 of any node, e.g.
# http://192.168.1.64:30880
#
# Prerequisite (not committed; holds a password):
#   kubectl -n agent-spawner create secret generic spawner-db \
#     --from-literal=url='postgres://spawner:<password>@postgresql.default.svc.cluster.local:5432/spawner?sslmode=disable'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-spawner
resources:
  - ../../base
images:
  - name: ghcr.io/biodigitaljaz/agent-spawner
    newTag: 0.1.31
configMapGenerator:
  - name: spawner-backends
    behavior: replace
    files:
      - backends.json
  # Web search for runs with "Search the web" on: the research-agent
  # namespace's SearXNG (JSON API).
  - name: spawner-env
    behavior: merge
    literals:
      - SEARCH_URL=http://searxng.research-agent.svc.cluster.local:8080
patches:
  - target:
      kind: Service
      name: spawner-api
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30880
  # Console links in MCP tool results point at the NodePort.
  - target:
      kind: Deployment
      name: spawner-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PUBLIC_URL, value: "http://192.168.1.64:30880"}
