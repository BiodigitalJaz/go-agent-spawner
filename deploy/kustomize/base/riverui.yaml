# Internal job inspector. Expose via port-forward or an authenticated ingress:
#   kubectl -n agents port-forward svc/riverui 8081:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riverui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: riverui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riverui
    spec:
      containers:
        - name: riverui
          image: ghcr.io/riverqueue/riverui:0.21.0
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: spawner-db, key: url}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: riverui
spec:
  selector:
    app.kubernetes.io/name: riverui
  ports:
    - {name: http, port: 80, targetPort: http}
