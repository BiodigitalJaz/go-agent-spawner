# Single-node NATS with in-memory JetStream: enough for the token event bus,
# which holds only a short replay window. For HA, use the official nats Helm
# chart with 3 replicas and set EVENT_REPLICAS=3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  # Memory caps must be set in a config file (there is no CLI flag for them).
  # Without them JetStream sizes itself from the node's memory, not the pod limit.
  nats.conf: |
    port: 4222
    http: 8222
    jetstream {
      store_dir: /data
      max_memory_store: 1GB
      max_file_store: 1GB
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: data, mountPath: /data}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: data
          emptyDir: {}
